<!-- painted Pichwai frame: lotus borders, kolam, bells, petals (src/web/art-layer.js) -->
<canvas id="art" aria-hidden="true"></canvas>

<!-- ───────── gate ───────── -->
<div id="gate">
  <div class="gate-inner">
    <canvas class="mono-c" data-mono="gate" aria-hidden="true"></canvas>
    <p class="gate-line">You are warmly invited to the</p>
    <p class="gate-cer script" data-t="ceremonyName"></p>
    <p class="gate-names caps" id="gate-names"></p>
  </div>
  <div class="gate-bottom">
    <button id="btn-light" class="btn-open" type="button" disabled><span class="btn-label">Preparing…</span></button>
    <button id="btn-silent" class="link-btn" type="button" hidden>or open without sound</button>
  </div>
</div>

<button id="sound" class="sound" type="button" aria-label="Toggle sound" hidden>
  <svg viewBox="0 0 32 32" aria-hidden="true"><use href="#i-sound"/></svg>
</button>
<div id="rail" class="rail" aria-hidden="true"><i></i></div>

<main id="story">

  <!-- 1 · names -->
  <section id="hero" class="act hero">
    <p class="hero-top" data-t="tagline"></p>
    <canvas class="mono-c" data-mono="hero" aria-hidden="true"></canvas>
    <h1 class="names" id="names">
      <span class="name" id="name-groom"></span>
      <span class="amp" aria-hidden="true">&amp;</span>
      <span class="name" id="name-bride"></span>
    </h1>
    <p class="tamil hero-tamil" data-t="ceremonyTamil"></p>
    <p class="script hero-cer" data-t="ceremonyName"></p>
    <p class="hero-date caps" id="hero-date"></p>
    <a class="cue" href="#arch" aria-label="Scroll down"><span class="caps">Scroll</span><i></i></a>
  </section>

  <!-- 2 · engagement scene in the temple arch: lamps light, a lotus opens, two rings meet (src/web/arch-scene.js) -->
  <section id="arch" class="act arch">
    <div class="arch-box" data-reveal>
      <div class="arch-win" id="arch-win">
        <canvas class="arch-bg" role="img" aria-label="Two brass lamps light up, a lotus opens and two engagement rings rise from it and link together"></canvas>
      </div>
      <svg class="arch-line" viewBox="-30 -90 820 1110" preserveAspectRatio="none" aria-hidden="true"><path id="arch-outline" fill="none"/><path id="arch-outline2" fill="none"/><path id="arch-finial"/></svg>
    </div>
    <p class="arch-hint caps">Tap the arch for a sparkle</p>
    <div class="arch-caps">
      <p class="script" data-reveal style="--d:1">Two souls,</p>
      <p class="script" data-reveal style="--d:3">two families,</p>
      <p class="script small" data-reveal style="--d:5">one beautiful beginning</p>
    </div>
  </section>

  <!-- 3 · invitation -->
  <section id="message" class="act message">
    <div class="paper-card" data-reveal>
      <p class="invocation caps" data-if="invocation" data-t="invocation"></p>
      <p class="lead" data-t="intro"></p>
      <p class="invite-names" id="invite-names"></p>
      <p class="lead" data-if="invitation" data-t="invitation"></p>
      <p class="lead small" data-t="closing"></p>
    </div>
  </section>

  <!-- 4 · save the date -->
  <section id="date" class="act date">
    <div class="paper-card">
      <p class="label caps" data-reveal>Save the date</p>
      <p class="date-line caps" data-reveal style="--d:1" id="date-line"></p>
      <p class="bd-time" data-reveal style="--d:2" id="bd-time"></p>
      <span hidden id="bd-week"></span><span hidden id="bd-day"></span><span hidden id="bd-month"></span>
      <div class="cal" data-reveal style="--d:2" id="cal"></div>
      <div class="countdown" data-reveal style="--d:3" id="countdown" aria-live="off">
        <div class="cd"><b data-u="d">00</b><span>Days</span></div>
        <div class="cd"><b data-u="h">00</b><span>Hours</span></div>
        <div class="cd"><b data-u="m">00</b><span>Mins</span></div>
        <div class="cd"><b data-u="s">00</b><span>Secs</span></div>
      </div>
    </div>
  </section>

  <!-- 5 · celebrations -->
  <section id="events" class="act events">
    <p class="label caps" data-reveal id="events-label">The celebrations</p>
    <div class="cards" id="event-cards"></div>
  </section>

  <!-- 6 · venue -->
  <section id="venue" class="act venue" data-if="venue.name">
    <div class="paper-card venue-card" data-reveal>
      <p class="script venue-label">Venue</p>
      <h2 class="venue-name" data-t="venue.name"></h2>
      <p class="venue-addr" data-if="venue.address" data-t="venue.address"></p>
      <p class="venue-mark" data-if="venue.landmark" data-t="venue.landmark"></p>
      <p class="dress" data-if="dressCode"><span class="caps">Dress code</span> <span data-t="dressCode"></span></p>
      <a id="btn-map" class="btn" target="_blank" rel="noopener"><svg viewBox="0 0 32 32" aria-hidden="true"><use href="#i-pin"/></svg><span>Get directions</span></a>
    </div>
  </section>

  <!-- 7 · families -->
  <section id="family" class="act family" data-if="families.heading">
    <div class="paper-card">
      <h2 class="script fam-heading" data-reveal data-t="families.heading"></h2>
      <div class="fam-cols" id="fam-cols"></div>
    </div>
  </section>

  <!-- 8 · RSVP -->
  <section id="rsvp" class="act rsvp">
    <div class="paper-card">
      <p class="label caps" data-reveal>Will you bless us with your presence?</p>
      <div class="actions" data-reveal style="--d:1">
        <a id="btn-rsvp" class="btn btn-wa" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-wa"/></svg><span>Confirm on WhatsApp</span></a>
        <a id="btn-gcal" class="btn" target="_blank" rel="noopener"><svg viewBox="0 0 32 32" aria-hidden="true"><use href="#i-cal"/></svg><span>Add to calendar</span></a>
        <button id="btn-share" class="btn" type="button"><svg viewBox="0 0 32 32" aria-hidden="true"><use href="#i-share"/></svg><span>Share this invite</span></button>
      </div>
      <canvas class="divider-c" data-divider aria-hidden="true"></canvas>
      <p class="sign script" data-reveal style="--d:2" id="sign"></p>
      <p class="hashtag caps" data-reveal style="--d:3" data-t="hashtag"></p>
    </div>
  </section>

</main>

<script src="app.js" defer></script>
</body>
</html>
